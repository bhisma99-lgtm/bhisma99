name: Run SENSEX Cloud Options Bot

on:
  schedule:
    - cron: '45 3 * * 1-5'   # 9:15 AM IST (03:45 UTC)
    - cron: '15 4 * * 1-5'   # 9:45 AM IST (04:15 UTC)
    - cron: '45 6 * * 1-5'   # 12:15 PM IST (06:45 UTC)
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp pandas openpyxl requests python-dotenv logzero websocket-client numpy

      - name: Run Standalone Cloud Bot
        env:
          ANGEL_ONE_API_KEY: ${{ secrets.ANGEL_ONE_API_KEY }}
          ANGEL_ONE_CLIENT_CODE: ${{ secrets.ANGEL_ONE_CLIENT_CODE }}
          ANGEL_ONE_PASSWORD: ${{ secrets.ANGEL_ONE_PASSWORD }}
          ANGEL_ONE_TOTP_SECRET: ${{ secrets.ANGEL_ONE_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          if [ -f "sensex_bot_cloud.py" ]; then python sensex_bot_cloud.py; else python .github/workflows/sensex_bot_cloud.py; fi

      - name: Commit & Push Excel Log Updates
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "GitHub Cloud Bot"
          git add signal_tracker.xlsx cloud_bot.log || true
          git commit -m "Auto-update signal tracker and logs [skip ci]" || true
          git push || true
