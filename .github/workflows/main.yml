name: Run SENSEX Cloud Options Bot

on:
  schedule:
    # Trigger EXACTLY once per day at 9:15 AM IST (03:45 UTC) Monday to Friday
    - cron: '45 3 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sensex-bot-concurrency
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ffmpeg for TTS voice notes)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp pandas openpyxl requests python-dotenv logzero websocket-client numpy gtts

      - name: Run Standalone Cloud Bot with Hard Market Close Timeout
        env:
          ANGEL_ONE_API_KEY: ${{ secrets.ANGEL_ONE_API_KEY }}
          ANGEL_ONE_CLIENT_CODE: ${{ secrets.ANGEL_ONE_CLIENT_CODE }}
          ANGEL_ONE_PASSWORD: ${{ secrets.ANGEL_ONE_PASSWORD }}
          ANGEL_ONE_TOTP_SECRET: ${{ secrets.ANGEL_ONE_TOTP_SECRET }}
          FORCE_PUBLIC_IP: ${{ secrets.FORCE_PUBLIC_IP }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          # Locate correct script target
          if [ -f "sbd_bot_cloud.py" ]; then
            SCRIPT_PATH="sbd_bot_cloud.py"
          elif [ -f ".github/workflows/sbd_bot_cloud.py" ]; then
            SCRIPT_PATH=".github/workflows/sbd_bot_cloud.py"
          elif [ -f "sensex_bot_cloud.py" ]; then
            SCRIPT_PATH="sensex_bot_cloud.py"
          elif [ -f ".github/workflows/sensex_bot_cloud.py" ]; then
            SCRIPT_PATH=".github/workflows/sensex_bot_cloud.py"
          else
            SCRIPT_PATH="sbd_bot_cloud.py"
          fi

          echo "Starting Bot. Enforcing strict 375-minute timeout (Forces exit at 3:30 PM IST)."
          
          # Linux 'timeout' forces exit code 124 when time limits expire.
          # We append '|| [ $? -eq 124 ]' to ensure the workflow finishes gracefully as a "Success" at 3:30 PM instead of showing a failure red cross.
          timeout 375m python "$SCRIPT_PATH" || [ $? -eq 124 ]

      - name: Commit & Push Excel Log Updates
        if: always() # Ensures logs upload even if the script was forcefully timed out
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "GitHub Cloud Bot"
          git add signal_tracker.xlsx cloud_bot.log bot_state_memory.json || true
          git commit -m "Auto-update signal tracker, logs and memory [skip ci]" || true
          git push || true
